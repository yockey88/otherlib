# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Dev Stability Assurance - Windows

on:
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release  -DBUILD_OTHER_TESTS=ON -DBUILD_DEVELOPMENT_DRIVERS=OFF

    - name: Build
      run: python ${{ github.workspace }}/cli.py -b -c=Release

    - name: Run Tests
      run: python ${{ github.workspace }}/cli.py -t -c=Release
      continue-on-error: true

    - name: Check Test Results
      run: python ${{ github.workspace }}/tools/test-validation.py ${{ github.workspace }}/other_test_results.xml
      continue-on-error: true

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: other-test-results
        path: ${{ github.workspace }}/other_test_results.xml