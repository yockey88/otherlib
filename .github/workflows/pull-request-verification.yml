name: "Pull Request Verification"

on:
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-test-windows-debug:
    uses: ./.github/workflows/build-and-test-windows.yml
    with:
      configuration: Debug
  build-and-test-windows-release:
    uses: ./.github/workflows/build-and-test-windows.yml
    with:
      configuration: Release