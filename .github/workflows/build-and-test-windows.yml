name: Build And Test

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      ## extensive tier runs on tag builds/releases: standard tier tests plus soak
      ##  harness (more integration stages to land later)
      extensive:
        required: false
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install regex

    - name: Bootstrap oecli
      run: python ${{ github.workspace }}/cli.py bootstrap -c ${{ inputs.configuration }} --tests

    - name: Build
      run: python ${{ github.workspace }}/cli.py build -c ${{ inputs.configuration }} --tests

    - name: Run Unit Tests
      run: python ${{ github.workspace }}/cli.py test -c ${{ inputs.configuration }}

    ## integration pipeline stages (extensive tier only — tag builds, never PRs);
    ##  GPU-dependent stages may need a self-hosted runner eventually
    - name: Run Soak Harness
      if: ${{ inputs.extensive }}
      run: python ${{ github.workspace }}/cli.py test --soak -c ${{ inputs.configuration }}

    ## the network gate: a tag cannot deploy unless the peer-mesh scenario passes;
    ##  its report doubles as the analysis artifact uploaded below
    - name: Run Network Harness
      if: ${{ inputs.extensive }}
      run: python ${{ github.workspace }}/cli.py test --network -c ${{ inputs.configuration }}

    ## parser fuzz gate: malformed input must reject gracefully on every parsing seam
    - name: Run Fuzz Harness
      if: ${{ inputs.extensive }}
      run: python ${{ github.workspace }}/cli.py test --fuzz -c ${{ inputs.configuration }}

    ## frame-load stress gate over the stress-arena scene (also the human tracy target)
    - name: Run Stress Harness
      if: ${{ inputs.extensive }}
      run: python ${{ github.workspace }}/cli.py test --stress -c ${{ inputs.configuration }}

    - name: Upload Harness Reports
      uses: actions/upload-artifact@v4
      if: ${{ always() && inputs.extensive }}
      with:
        name: other-harness-reports-${{ inputs.configuration }}
        path: |
          logs/network-report.json
          logs/soak-report.json
          logs/fuzz-report.json
          logs/stress-report.json

    - name: Check Test Results
      if: always()
      run: |
        $lcconfig = "${{ inputs.configuration }}".ToLower()
        $respath = "${{ github.workspace }}\other_test_results.windows.${lcconfig}.xml"
        python ${{ github.workspace }}/tools/test-validation.py $respath

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: other-test-results-windows-${{ inputs.configuration }}
        path: other_test_results.windows.*.xml

    ## on failure, ship every runtime log: each test writes logs/tests/<suite>.<test>.log,
    ##  so when the suite process dies mid-run (no xml written) the most recently
    ##  modified file there names the dying test; harness runs log to logs/*.log
    - name: Upload Test Logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: other-test-logs-${{ inputs.configuration }}
        path: |
          logs/
          other.log
          other-log-failure.log
        if-no-files-found: ignore