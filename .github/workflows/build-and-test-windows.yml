name: Build And Test

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      ## the extensive tier runs on tag builds/releases: everything the standard tier
      ##  runs plus the soak harness (and, as they land, the rest of the integration
      ##  test pipeline)
      extensive:
        required: false
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install regex

    - name: Bootstrap oecli
      run: python ${{ github.workspace }}/cli.py bootstrap -c ${{ inputs.configuration }} --tests

    - name: Build
      run: python ${{ github.workspace }}/cli.py build -c ${{ inputs.configuration }} --tests

    - name: Run Unit Tests
      run: python ${{ github.workspace }}/cli.py test -c ${{ inputs.configuration }}

    ## integration pipeline stages (extensive tier only — tag builds, never PRs).
    ##  GPU-dependent stages may need a self-hosted runner once they exercise the
    ##  renderer for real.
    - name: Run Soak Harness
      if: ${{ inputs.extensive }}
      run: python ${{ github.workspace }}/cli.py test --soak -c ${{ inputs.configuration }}

    ## the network gate: a tag cannot deploy unless the peer-mesh scenario passes;
    ##  its report doubles as the analysis artifact uploaded below
    - name: Run Network Harness
      if: ${{ inputs.extensive }}
      run: python ${{ github.workspace }}/cli.py test --network -c ${{ inputs.configuration }}

    - name: Upload Harness Reports
      uses: actions/upload-artifact@v4
      if: ${{ always() && inputs.extensive }}
      with:
        name: other-harness-reports-${{ inputs.configuration }}
        path: |
          logs/network-report.json
          logs/soak-report.json

    - name: Check Test Results
      if: always()
      run: |
        $lcconfig = "${{ inputs.configuration }}".ToLower()
        $respath = "${{ github.workspace }}\other_test_results.windows.${lcconfig}.xml"
        python ${{ github.workspace }}/tools/test-validation.py $respath

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: other-test-results-windows-${{ inputs.configuration }}
        path: other_test_results.windows.*.xml
