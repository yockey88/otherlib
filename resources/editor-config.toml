[application]
name = "Other Editor"
metadata = [ 
  { key = "name", value = "Other Editor"}, 
  { key = "description", value = "Other Environment Project Editor"},
  { key = "author", value = "Other Team"},
  { key = "version", value = "0.1.0"} 
]
core-log-level = "debug"
core-log-file = "logs/editor.log"
auto-play-loaded-scenes = false

[filesystem]
mounts = [
  { name = "editor-assets", type = "physical", path = "resources/editor-assets" }
]

[rendering]
ui-layout-ini = "resources/ui/editor-layout.ini"
pipeline = { geometry_pass_shader = "resources/basic-instancing-gbuffer", shadow_map_pass_shader = "resources/basic-instancing-shadow-map", point_light_shadow_pass_shader = "resources/basic-instancing-point-light-shadow-map", shading_pass_shader = "resources/basic-shading", debug_processing_shader = "resources/debug-processing", screen_shader = "resources/basic-textured-quad" }

[ui]
enable-environment-menu-bar = false

[assets]
test-model = "resources/models/spinning-torus.fbx"

[scripting]
envrc-path = "resources/editor-rc.lua"
# bridge dll for C# interop (private API)
dotnet-bindings = "build/other-csharp/${build-config}/OtherCsBindings.dll"
dotnet-runtime-config = "other-csharp-interop/resources/OtherCsBindings.runtimeconfig.json"
# client dll for C# interop (public API)
other-csharp = "build/other-csharp/${build-config}/OtherCs.dll"

# bridge directory for lua script (Prublit API)
other-lua-directory = "resources/lua"

dotnet-modules = [
  "build/other-editor/dotnet/${build-config}/OtherEditorCs.dll",
  "build/script-testing/${build-config}/DotnetTesting.dll",
]