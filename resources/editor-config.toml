[application]
core-log-level = "debug"
core-log-file = "logs/editor.log"

[rendering]
backend = "opengl"
ui-layout-ini = "resources/ui/editor-layout.ini"
window-size = { width = 1920, height = 1080 }


[scripting]
dotnet-bindings = "build/other-csharp/${build-config}/OtherCsBindings.dll"
dotnet-runtime-config = "other-csharp-interop/resources/OtherCsBindings.runtimeconfig.json"
other-csharp = "build/other-csharp/${build-config}/OtherCs.dll"
dotnet-modules = [
  "build/development-drivers/script-testing/csharp/Debug/DotnetTesting.dll"
]