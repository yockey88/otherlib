[driver]
boot-file = "${other-directory}/resources/editor-assets/editor-boot.oasm"
# vm-debug-mode = true
plugins = []

[application]
name = "Other Editor"
metadata = [ 
  { key = "name", value = "Other Editor"}, 
  { key = "description", value = "Other Environment Project Editor"},
  { key = "author", value = "N/A"},
  { key = "version", value = "0.1.0"} 
]
core-log-level = "info"
core-log-file = "${other-directory}/logs/editor.log"
auto-play-loaded-scenes = false

[filesystem]
# poll project files for hot-reload (off = assets treated as static)
watch-assets = true
# watch-interval-ms = 250

[rendering]
# fullscreen = true
# enable-debug = false
ui-layout-ini = "${other-directory}/resources/ui/editor-layout.ini"
imgui-font = "${other-directory}/resources/fonts/BlexMonoNerdFont-Regular.ttf"
pipelines = [ "${other-directory}/resources/editor-assets/default-pipeline.toml" ]

[ui]
enable-environment-menu-bar = true

[scripting]
init-lua = "${other-directory}/resources/editor.lua"
dotnet-runtime-config = "${other-directory}/dotnet-assemblies/OtherCsBindings.runtimeconfig.json"
dotnet-bindings = "${other-directory}/dotnet-assemblies/OtherCsBindings.dll"
other-csharp = "${other-directory}/dotnet-assemblies/OtherCs.dll"
other-lua-directory = "${other-directory}/lua"
dotnet-modules = [ "${other-directory}/dotnet-assemblies/OtherEditorCs.dll" ]