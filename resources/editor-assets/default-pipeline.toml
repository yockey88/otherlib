asset-type = "rendering-pipeline"
name = "default-instancing"
version = 1

[lighting]
shadow_map_pass_name = "shadow-map-pass"
shading_pass_name = "shading-pass"
light_space_matrix_uniform_name = "OE_light_space_matrix"

[resources]
## per-draw ring tags (model/bone/material) have no static buffer rows: the rings are the
## storage, and their shader blocks are wired to the pass-binding points at pass start
buffers = [
  { name = "camera_buffer", type = "UNIFORM_BUFFER", usage = "DYNAMIC", tag = "camera" },
  { name = "light_buffer", type = "STORAGE_BUFFER", usage = "DYNAMIC", tag = "light" },
  { name = "simulation_environment_buffer", type = "UNIFORM_BUFFER", usage = "DYNAMIC", tag = "simulation_environment" },
]
textures = [
  # basic gbuffer
  { name = "color_texture", use_window_size = true, type = "TEXTURE_2D", format = "RGBA16F" },
  { name = "normal_texture", use_window_size = true, type = "TEXTURE_2D", format = "RGBA16F" },
  { name = "position_texture", use_window_size = true, type = "TEXTURE_2D", format = "RGBA16F" },
  { name = "depth_texture", use_window_size = true, type = "TEXTURE_2D", format = "R16F" },
  # real depth attachment written by the geometry pass and shared by the in-scene overlay passes
  { name = "scene_depth", use_window_size = true, type = "TEXTURE_2D", format = "DEPTHF" },
  # voxel gbuffer
  # { name = "voxel_gbuff_color", use_window_size = false, type = "TEXTURE_3D", format = "RGBA16F", size = { x = 128, y = 128 }, depth = 128 },
  # { name = "voxel_gbuff_normal", use_window_size = false, type = "TEXTURE_3D", format = "RGBA16F", size = { x = 128, y = 128 }, depth = 128 },
  # { name = "voxel_gbuff_emissive", use_window_size = false, type = "TEXTURE_3D", format = "RGBA16F", size = { x = 128, y = 128 }, depth = 128 },

  { name = "ambient_shadow_map", use_window_size = true, type = "TEXTURE_2D", format = "DEPTHF" },
  { name = "sun_depth_color", use_window_size = true, type = "TEXTURE_2D", format = "RGBA16F" },
  { name = "voxel_texture", use_window_size = true, type = "TEXTURE_3D", format = "RGBA16F", size = { x = 128, y = 128 }, depth = 128 },
  { name = "environment_map", use_window_size = false, type = "TEXTURE_3D", format = "RGBA16F", size = { x = 64, y = 64 }, depth = 64 },
  { name = "environment_map_prev", use_window_size = false, type = "TEXTURE_3D", format = "RGBA16F", size = { x = 64, y = 64 }, depth = 64 },
  { name = "shaded_texture", use_window_size = true, type = "TEXTURE_2D", format = "RGBA16F" },
  { name = "smaa_edge_texture", use_window_size = true,  type = "TEXTURE_2D", format = "RG8"   },
  { name = "smaa_weight_texture", use_window_size = true,  type = "TEXTURE_2D", format = "RGBA8" },
  { name = "smaa_area_texture", use_window_size = false, type = "TEXTURE_2D", format = "RG8", size = { x = 160, y = 560 }, seed_texture_path = "resources/smaa-area-tex.bin" },
  { name = "smaa_search_texture", use_window_size = false, type = "TEXTURE_2D", format = "R8", size = { x = 64,  y = 16  }, seed_texture_path = "resources/smaa-search-tex.bin" },
  { name = "smaa_texture", use_window_size = true,  type = "TEXTURE_2D", format = "RGBA8"  },
  { name = "tonemapped_texture", use_window_size = true, type = "TEXTURE_2D", format = "RGBA16F" },
]
shaders = [
  { name = "voxel_clear_shader", compute_path = "resources/voxel-clear.comp" },
  { name = "geometry_pass_shader", vertex_path = "resources/basic-instancing-gbuffer.vert", fragment_path = "resources/basic-instancing-gbuffer.frag" },
  # { name = "voxel_geometry_shader", vertex_path = "resources/voxel-geometry.vert", geometry_path = "resources/voxel-geometry.geom", fragment_path = "resources/voxel-geometry.frag" },
  { name = "voxel_occupied_shader", compute_path = "resources/voxel-occupied.comp" },
  { name = "voxelize_shader", vertex_path = "resources/voxelizer.vert", geometry_path = "resources/voxelizer.geom", fragment_path = "resources/voxelizer.frag" },
  { name = "shadow_map_shader", vertex_path = "resources/basic-instancing-shadow-map.vert", fragment_path = "resources/basic-shadow-map.frag" },
  { name = "environment_map_pass", compute_path = "resources/basic-environment-map.comp" },
  { name = "shading_pass_shader", vertex_path = "resources/basic-shading.vert", fragment_path = "resources/basic-shading.frag" },
  { name = "smaa_edges_shader", vertex_path = "resources/smaa-edges.vert", fragment_path = "resources/smaa-edges.frag" },
  { name = "smaa_weights_shader", vertex_path = "resources/smaa-weights.vert", fragment_path = "resources/smaa-weights.frag" },
  { name = "smaa_blend_shader", vertex_path = "resources/smaa-blend.vert", fragment_path = "resources/smaa-blend.frag" },
  { name = "tonemap_pass_shader", vertex_path = "resources/basic-textured-quad.vert", fragment_path = "resources/basic-tonemap.frag" },
  { name = "screen_shader", vertex_path = "resources/basic-textured-quad.vert", fragment_path = "resources/basic-textured-quad.frag" },
  { name = "scene_grid_shader", vertex_path = "resources/scene-grid.vert", fragment_path = "resources/scene-grid.frag" },
  { name = "scene_overlay_shader", vertex_path = "resources/debug-overlay.vert", fragment_path = "resources/debug-overlay.frag" },
  ## forward transparent pass reuses the instancing geometry vertex stage; only the fragment differs
  { name = "forward_transparent_shader", vertex_path = "resources/basic-instancing-gbuffer.vert", fragment_path = "resources/basic-forward-transparent.frag" },
]

## material block basic-material.glsl mirrors; per-draw binding size is std430-computed from
## this. albedo.a carries roughness (formerly specular_reflect); texture units 0-7 are pass inputs
[materials.layout]
params = [
  { name = "base_color",     type = "vec4",  default = [1.0, 1.0, 1.0, 1.0] },
  { name = "emissive_color", type = "vec3",  default = [0.0, 0.0, 0.0] },
  { name = "roughness",      type = "float", default = 1.0 },
  { name = "metalness",      type = "float", default = 0.0 },
]
texture-slots = [
  { name = "base_color", uniform = "OE_mat_base_color_map", unit = 8 },
  { name = "normal",     uniform = "OE_mat_normal_map",     unit = 9 },
]

[frame]
display-texture = "smaa_texture"
bindings = [
  ## element_size omitted: derived from [materials.layout] (element * instance capacity)
  { name = "per_draw.material_buffer", tag = "material", scope = "PER_DRAW", type = "STORAGE_BUFFER" },
  { name = "per_draw.model_buffer", tag = "model", scope = "PER_DRAW", type = "UNIFORM_BUFFER", element_size = 6400 },
  { name = "per_draw.bone_buffer", tag = "bone", scope = "PER_DRAW", type = "UNIFORM_BUFFER", element_size = 6416 },
  { name = "per_frame.camera_buffer", tag = "camera", scope = "PER_FRAME", type = "UNIFORM_BUFFER", element_size = 208 },
  { name = "per_frame.light_buffer", tag = "light", scope = "PER_FRAME", type = "STORAGE_BUFFER", element_size = 4800 },
  { name = "per_frame.simulation_environment_buffer", tag = "simulation_environment", scope = "PER_FRAME", type = "UNIFORM_BUFFER", element_size = 128 }
]
pass-bindings = [
  { pass_name = "geometry-pass", name = "per_draw.model_buffer", binding = 0 }, 
  { pass_name = "geometry-pass", name = "per_draw.bone_buffer", binding = 1 },
  { pass_name = "geometry-pass", name = "per_draw.material_buffer", binding = 2 }, 
  { pass_name = "geometry-pass", name = "per_frame.camera_buffer", binding = 3 }, 
  { pass_name = "voxelize-pass", name = "per_draw.model_buffer", binding = 0 },
  { pass_name = "voxelize-pass", name = "per_frame.light_buffer", binding = 1 },
  ## depth-only passes need the bone ring too or skinned meshes shadow/occlude in bind pose
  { pass_name = "voxelize-pass", name = "per_draw.bone_buffer", binding = 2 },
  { pass_name = "shadow-map-pass", name = "per_draw.model_buffer", binding = 0 },
  { pass_name = "shadow-map-pass", name = "per_draw.bone_buffer", binding = 1 },
  { pass_name = "environment-map-pass", name = "per_frame.simulation_environment_buffer", binding = 0 },
  { pass_name = "environment-map-pass", name = "per_frame.light_buffer", binding = 1 },
  { pass_name = "shading-pass", name = "per_frame.light_buffer", binding = 0 },
  { pass_name = "shading-pass", name = "per_frame.simulation_environment_buffer", binding = 1 },
  ## transparent pass binds the full per-draw ring set (vertex stage) plus the frame lighting
  ## buffers (fragment stage); UBO points 0/1/3/5 and SSBO points 2/4 live in separate GL spaces
  { pass_name = "transparent-pass", name = "per_draw.model_buffer", binding = 0 },
  { pass_name = "transparent-pass", name = "per_draw.bone_buffer", binding = 1 },
  { pass_name = "transparent-pass", name = "per_draw.material_buffer", binding = 2 },
  { pass_name = "transparent-pass", name = "per_frame.camera_buffer", binding = 3 },
  { pass_name = "transparent-pass", name = "per_frame.light_buffer", binding = 4 },
  { pass_name = "transparent-pass", name = "per_frame.simulation_environment_buffer", binding = 5 }
]
passes = [
  ## geometry and data preparation passes
  { name = "voxel-clear-pass", pass_type = "COMPUTE_PASS", shader_name = "voxel_clear_shader" },
  { name = "geometry-pass", pass_type = "RENDER_PASS", shader_name = "geometry_pass_shader" },
  { name = "voxel-occupied-pass", pass_type = "COMPUTE_PASS", shader_name = "voxel_occupied_shader" },
  { name = "voxelize-pass", pass_type = "RENDER_PASS", shader_name = "voxelize_shader", create_framebuffer = false, depends_on = [ "voxel-occupied-pass" ] },
  ## shadows and main shading passes
  { name = "shadow-map-pass", pass_type = "RENDER_PASS", shader_name = "shadow_map_shader" },
  { name = "environment-map-pass", pass_type = "COMPUTE_PASS", shader_name = "environment_map_pass" },
  { name = "shading-pass", pass_type = "RENDER_PASS", shader_name = "shading_pass_shader" },
  ## in-scene overlays (procedural grids + dynamic scene draw streams), depth tested against scene_depth
  { name = "grid-pass", pass_type = "RENDER_PASS", shader_name = "scene_grid_shader", depends_on = [ "shading-pass" ], clear_bits = [] },
  { name = "scene-overlay-pass", pass_type = "RENDER_PASS", shader_name = "scene_overlay_shader", depends_on = [ "grid-pass" ], clear_bits = [] },
  ## blended forward transparency, painter-sorted, depth-tested against scene_depth without
  ## writing it; last in-scene pass so glass composites over grids and overlays too
  { name = "transparent-pass", pass_type = "RENDER_PASS", shader_name = "forward_transparent_shader", depends_on = [ "scene-overlay-pass" ], clear_bits = [] },
  ## additional shading / screen-space passes
  ## anit-aliasing and post-processing passes
  { name = "smaa-edges", pass_type = "RENDER_PASS", shader_name = "smaa_edges_shader" },
  { name = "smaa-weights", pass_type = "RENDER_PASS", shader_name = "smaa_weights_shader" },
  { name = "smaa-blend", pass_type = "RENDER_PASS", shader_name = "smaa_blend_shader" },
  { name = "tonemap-pass", pass_type = "RENDER_PASS", shader_name = "tonemap_pass_shader" },
]
pass-uniforms = [
  { pass_name = "voxel-clear-pass", name = "OE_voxel_decay", value = 2.0 },
  { pass_name = "voxel-occupied-pass", name = "OE_gbuff_position", value = 1 }, 
  { pass_name = "voxel-occupied-pass", name = "OE_gbuff_normal", value = 2 },
  { pass_name = "environment-map-pass", name = "OE_sun_softness", value = 1.5 },
  { pass_name = "environment-map-pass", name = "OE_ao_strength",  value = 1.0 },
  { pass_name = "tonemap-pass", name = "OE_exposure", value = 1.0 },
  { pass_name = "tonemap-pass", name = "OE_gamma", value = 2.2 }
]
inputs = [
  { pass_name = "voxel-clear-pass", resource_name = "voxel_texture", binding = 0, uniform_name = "OE_voxel_tex_in" },
  { pass_name = "geometry-pass", resource_name = "camera_buffer", binding = 3 },
  { pass_name = "voxel-occupied-pass", resource_name = "simulation_environment_buffer", binding = 0 },
  { pass_name = "voxel-occupied-pass", resource_name = "voxel_texture", binding = 0, uniform_name = "OE_voxel_tex_in" },     
  { pass_name = "voxel-occupied-pass", resource_name = "position_texture", attachment = "COLOR", binding = 1, uniform_name = "OE_gbuff_position" },
  { pass_name = "voxel-occupied-pass", resource_name = "normal_texture", attachment = "COLOR", binding = 2, uniform_name = "OE_gbuff_normal" },
  { pass_name = "voxelize-pass", resource_name = "voxel_texture", binding = 0, uniform_name = "OE_voxel_tex" },
  { pass_name = "environment-map-pass", resource_name = "simulation_environment_buffer", binding = 0 },
  { pass_name = "environment-map-pass", resource_name = "light_buffer", binding = 1 },
  { pass_name = "environment-map-pass", resource_name = "ambient_shadow_map", binding = 1, uniform_name = "OE_shadow_map", access = "sample" },
  { pass_name = "environment-map-pass", resource_name = "voxel_texture", binding = 2, uniform_name = "OE_voxel_tex", access = "sample" },
  { pass_name = "shading-pass", resource_name = "color_texture", binding = 0, uniform_name = "OE_gbuff_albedo" },
  { pass_name = "shading-pass", resource_name = "normal_texture", binding = 1, uniform_name = "OE_gbuff_normal" },
  { pass_name = "shading-pass", resource_name = "position_texture", binding = 2, uniform_name = "OE_gbuff_position" },
  { pass_name = "shading-pass", resource_name = "depth_texture", binding = 3, uniform_name = "OE_gbuff_depth" },
  { pass_name = "shading-pass", resource_name = "ambient_shadow_map", binding = 4, uniform_name = "OE_shadow_map" },
  { pass_name = "shading-pass", resource_name = "voxel_texture", binding = 5, uniform_name = "OE_voxel_tex" },
  { pass_name = "shading-pass", resource_name = "environment_map", binding = 6, uniform_name = "OE_env_cubemap" },
  { pass_name = "shading-pass", resource_name = "camera_buffer", binding = 0 },
  { pass_name = "shading-pass", resource_name = "light_buffer", binding = 1 },
  { pass_name = "grid-pass", resource_name = "camera_buffer", binding = 0 },
  { pass_name = "scene-overlay-pass", resource_name = "camera_buffer", binding = 0 },
  { pass_name = "transparent-pass", resource_name = "camera_buffer", binding = 3 },
  { pass_name = "transparent-pass", resource_name = "light_buffer", binding = 4 },
  { pass_name = "transparent-pass", resource_name = "simulation_environment_buffer", binding = 5 },
  { pass_name = "transparent-pass", resource_name = "ambient_shadow_map", binding = 0, uniform_name = "OE_shadow_map" },
  { pass_name = "transparent-pass", resource_name = "voxel_texture", binding = 1, uniform_name = "OE_voxel_tex" },
  { pass_name = "transparent-pass", resource_name = "environment_map", binding = 2, uniform_name = "OE_env_cubemap" },
  { pass_name = "tonemap-pass", resource_name = "shaded_texture", binding = 0, uniform_name = "OE_texture" },
  { pass_name = "smaa-edges", resource_name = "tonemapped_texture", binding = 0, uniform_name = "OE_color" },
  { pass_name = "smaa-weights", resource_name = "smaa_edge_texture", binding = 0, uniform_name = "OE_edges" },
  { pass_name = "smaa-weights", resource_name = "smaa_area_texture", binding = 1, uniform_name = "OE_area" },
  { pass_name = "smaa-weights", resource_name = "smaa_search_texture", binding = 2, uniform_name = "OE_search" },
  { pass_name = "smaa-blend", resource_name = "tonemapped_texture", binding = 0, uniform_name = "OE_color" },
  { pass_name = "smaa-blend", resource_name = "smaa_weight_texture", binding = 1, uniform_name = "OE_weights" },
]
outputs = [
  { pass_name = "voxel-clear-pass", resource_name = "voxel_texture", binding = 1, uniform_name = "OE_voxel_tex_out" },
  { pass_name = "geometry-pass", resource_name = "color_texture", attachment = "COLOR" },
  { pass_name = "geometry-pass", resource_name = "normal_texture", attachment = "COLOR" },
  { pass_name = "geometry-pass", resource_name = "position_texture", attachment = "COLOR" },
  { pass_name = "geometry-pass", resource_name = "depth_texture", attachment = "COLOR" },
  { pass_name = "geometry-pass", resource_name = "scene_depth", attachment = "DEPTH" },
  { pass_name = "voxel-occupied-pass", resource_name = "voxel_texture", attachment = "COLOR", binding = 3, uniform_name = "OE_voxel_tex_out" },
  { pass_name = "voxelize-pass", resource_name = "voxel_texture", attachment = "COLOR", binding = 0, uniform_name = "OE_voxel_tex" },
  { pass_name = "shadow-map-pass", resource_name = "ambient_shadow_map", attachment = "DEPTH" },
  { pass_name = "environment-map-pass", resource_name = "environment_map", binding = 0, uniform_name = "OE_env_cubemap" },
  { pass_name = "shading-pass", resource_name = "shaded_texture", attachment = "COLOR" },
  { pass_name = "grid-pass", resource_name = "shaded_texture", attachment = "COLOR" },
  { pass_name = "grid-pass", resource_name = "scene_depth", attachment = "DEPTH" },
  { pass_name = "scene-overlay-pass", resource_name = "shaded_texture", attachment = "COLOR" },
  { pass_name = "scene-overlay-pass", resource_name = "scene_depth", attachment = "DEPTH" },
  { pass_name = "transparent-pass", resource_name = "shaded_texture", attachment = "COLOR" },
  { pass_name = "transparent-pass", resource_name = "scene_depth", attachment = "DEPTH" },
  { pass_name = "tonemap-pass", resource_name = "tonemapped_texture", attachment = "COLOR" },
  { pass_name = "smaa-edges", resource_name = "smaa_edge_texture", attachment = "COLOR" },
  { pass_name = "smaa-weights", resource_name = "smaa_weight_texture", attachment = "COLOR" },
  { pass_name = "smaa-blend", resource_name = "smaa_texture", attachment = "COLOR" },
]
executors = [
  { pass_name = "voxel-clear-pass", name = "compute_dispatch", params = [ { name = "barrier", value = "shader_image_access" }, { name = "groups", value=[8,8,32] } ] },
  { pass_name = "geometry-pass", name = "draw_scene" },
  { pass_name = "voxel-occupied-pass", name = "window_sized_compute_dispatch", params = [ { name = "barrier", value = "shader_image_access" }, { name = "groups", value=[8,8,1] } ] },
  { pass_name = "voxelize-pass", name = "voxelize", params = [ { name = "voxel_dim", value = 128 } ] },
  { pass_name = "shadow-map-pass", name = "draw_scene" },
  { pass_name = "environment-map-pass", name = "compute_dispatch", params = [ { name = "barrier", value = "all" }, { name = "groups", value=[4,4,64] } ] },
  { pass_name = "shading-pass", name = "fullscreen_quad" },
  { pass_name = "grid-pass", name = "scene_grids" },
  { pass_name = "scene-overlay-pass", name = "scene_overlay" },
  { pass_name = "transparent-pass", name = "draw_scene_transparent" },
  { pass_name = "smaa-edges", name = "fullscreen_quad" },
  { pass_name = "smaa-weights", name = "fullscreen_quad" },
  { pass_name = "smaa-blend", name = "fullscreen_quad" },
  { pass_name = "tonemap-pass", name = "fullscreen_quad" },
]
## ring tags (model/bone/material) have no rows here: required_tags demands a tagged static
## resource, and the per-draw rings replaced those
resource_tags = [
  { name = "camera", type = "BUFFER" },
  { name = "light", type = "BUFFER" },
  { name = "simulation_environment", type = "BUFFER" },
]