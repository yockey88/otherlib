asset-type = "rendering-pipeline"
name = "default-instancing"
version = 1

[lighting]
shadow_map_pass_name = "shadow-map-pass"
shading_pass_name = "shading-pass"
light_space_matrix_uniform_name = "OE_light_space_matrix"

[resources]
buffers = [
  { name = "camera_buffer", binding_name = "per_frame.camera_buffer", type = "UNIFORM_BUFFER", usage = "DYNAMIC", scope = "PER_FRAME", element_size = 208, tag = "camera" },
  { name = "model_buffer", binding_name = "per_draw.model_buffer", type = "UNIFORM_BUFFER", usage = "DYNAMIC", scope = "PER_DRAW", element_size = 6400, tag = "model" },
  { name = "bone_buffer", binding_name = "per_draw.bone_buffer", type = "UNIFORM_BUFFER", usage = "DYNAMIC", scope = "PER_DRAW", element_size = 6416, tag = "bone" },
  { name = "light_buffer", binding_name = "per_frame.light_buffer", type = "STORAGE_BUFFER", usage = "DYNAMIC", scope = "PER_FRAME", element_size = 9600, tag = "light" },
  { name = "simulation_environment_buffer", binding_name = "per_frame.simulation_environment_buffer", type = "UNIFORM_BUFFER", usage = "DYNAMIC", scope = "PER_FRAME", element_size = 128, tag = "simulation_environment" },
  { name = "material_buffer", binding_name = "per_draw.material_buffer", type = "STORAGE_BUFFER", usage = "DYNAMIC", scope = "PER_DRAW", element_size = 6400, tag = "material" },
]
textures = [
  { name = "color_texture", use_window_size = true, type = "TEXTURE_2D", format = "RGBA32U", sampler_name = "OE_gbuff_albedo" },
  { name = "normal_texture", use_window_size = true, type = "TEXTURE_2D", format = "RGBA16F", sampler_name = "OE_gbuff_normal" },
  { name = "position_texture", use_window_size = true, type = "TEXTURE_2D", format = "RGBA16F", sampler_name = "OE_gbuff_position" },
  { name = "ambient_shadow_map", use_window_size = true, type = "TEXTURE_2D", format = "DEPTHF", sampler_name = "OE_shadow_map" },
  { name = "environment_map", use_window_size = false, type = "TEXTURE_3D", format = "RGBA16F", size = { x = 512, y = 512 }, depth = 6, sampler_name = "OE_env_cubemap" },
  { name = "shaded_texture", use_window_size = true, type = "TEXTURE_2D", format = "RGBA16F", sampler_name = "OE_voxel_tex" },
]
shaders = [
  { name = "geometry_pass_shader", vertex_path = "resources/basic-instancing-gbuffer.vert", fragment_path = "resources/basic-instancing-gbuffer.frag" },
  { name = "shadow_map_shader", vertex_path = "resources/basic-instancing-shadow-map.vert", fragment_path = "resources/basic-instancing-shadow-map.frag" },
  { name = "environment_map_pass", compute_path = "resources/basic-environment-map.comp" },
  { name = "shading_pass_shader", vertex_path = "resources/basic-shading.vert", fragment_path = "resources/basic-shading.frag" },
  { name = "screen_shader", vertex_path = "resources/basic-textured-quad.vert", fragment_path = "resources/basic-textured-quad.frag" },
]

[frame]
pass-bindings = [
  { pass_name = "geometry-pass", bindings = [ "per_draw.model_buffer", "per_draw.bone_buffer", "per_draw.material_buffer", "per_frame.camera_buffer" ] }, 
  { pass_name = "shadow-map-pass", bindings = [ "per_draw.model_buffer" ] }, 
  { pass_name = "environment-map-pass", bindings = [ "per_frame.simulation_environment_buffer" ] }, 
  { pass_name = "shading-pass", bindings = [ "per_frame.camera_buffer", "per_frame.light_buffer" ] },
]
passes = [
  { name = "geometry-pass", pass_type = "RENDER_PASS", shader_name = "geometry_pass_shader" },
  { name = "shadow-map-pass", pass_type = "RENDER_PASS", shader_name = "shadow_map_shader" },
  { name = "environment-map-pass", pass_type = "COMPUTE_PASS", shader_name = "environment_map_pass" },
  { name = "shading-pass", pass_type = "RENDER_PASS", shader_name = "shading_pass_shader" },
]
inputs = [
  { pass_name = "geometry-pass", resource_name = "model_buffer", binding = 0 },
  { pass_name = "geometry-pass", resource_name = "bone_buffer", binding = 1 },
  { pass_name = "geometry-pass", resource_name = "material_buffer", binding = 2 },
  { pass_name = "geometry-pass", resource_name = "camera_buffer", binding = 3 },
  { pass_name = "shadow-map-pass", resource_name = "model_buffer", binding = 0 },
  { pass_name = "environment-map-pass", resource_name = "ambient_shadow_map", binding = 0 },
  { pass_name = "environment-map-pass", resource_name = "simulation_environment_buffer", binding = 0 },
  { pass_name = "shading-pass", resource_name = "color_texture", binding = 0 },
  { pass_name = "shading-pass", resource_name = "normal_texture", binding = 1 },
  { pass_name = "shading-pass", resource_name = "position_texture", binding = 2 },
  { pass_name = "shading-pass", resource_name = "ambient_shadow_map", binding = 3 },
  { pass_name = "shading-pass", resource_name = "camera_buffer", binding = 0 },
  { pass_name = "shading-pass", resource_name = "light_buffer", binding = 1 },
]
outputs = [
  { pass_name = "geometry-pass", resource_name = "color_texture", attachment = "COLOR" },
  { pass_name = "geometry-pass", resource_name = "normal_texture", attachment = "COLOR" },
  { pass_name = "geometry-pass", resource_name = "position_texture", attachment = "COLOR" },
  { pass_name = "shadow-map-pass", resource_name = "ambient_shadow_map", attachment = "DEPTH" },
  { pass_name = "environment-map-pass", resource_name = "environment_map" },
  { pass_name = "shading-pass", resource_name = "shaded_texture", attachment = "COLOR" },
]
executors = [
  { pass_name = "geometry-pass", name = "draw_scene" },
  { pass_name = "shadow-map-pass", name = "draw_scene" },
  { pass_name = "environment-map-pass", name = "compute_dispatch", params = [ { name = "barrier", value = "shader_image_access" }, { name = "groups", value=[32,32,6] } ], uniforms = [ { name = "OE_shadow_map", value = 0 }, { name = "OE_env_cubemap", value = 1 } ] },
  { pass_name = "shading-pass", name = "fullscreen_quad", uniforms = [ { name = "OE_gbuff_albedo", value = 0 }, { name = "OE_gbuff_normal", value = 1 }, { name = "OE_gbuff_position", value = 2 }, { name = "OE_shadow_map", value = 3 }, { name = "OE_env_cubemap", value = 4 }, { name = "OE_voxel_tex", value = 5 } ] },
]
resource_tags = [
  { name = "camera", type = "BUFFER" },
  { name = "model", type = "BUFFER" },
  { name = "bone", type = "BUFFER" },
  { name = "light", type = "BUFFER" },
  { name = "simulation_environment", type = "BUFFER" },
  { name = "material", type = "BUFFER" },
  # { name = "screen", type = "TEXTURE" },
]